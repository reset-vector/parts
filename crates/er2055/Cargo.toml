[package]
name = "rvec-er2055"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
description = "The General Instrument `ER2055`, a 64 × 8 EAROM, at its pins."
license = "MIT"
repository = "https://github.com/reset-vector/parts"
