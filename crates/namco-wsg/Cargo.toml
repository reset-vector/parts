[package]
name = "rvec-namco-wsg"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
description = "Namco's 3-channel wavetable sound generator — a **section of the Pac-Man game board**, not a package — at its own edge."
license = "MIT"
repository = "https://github.com/reset-vector/parts"
publish = false

[lib]
name = "namco_wsg"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
signal = { package = "rvec-signal", version = "1", path = "../signal" }
units = { package = "rvec-units", version = "1", path = "../units" }
