[package]
name = "rvec-msm6295"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
description = "The OKI MSM6295 four-channel ADPCM voice synthesis LSI, at its pins."
license = "MIT"
repository = "https://github.com/reset-vector/parts"
publish = false

[lib]
name = "msm6295"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
signal = { package = "rvec-signal", version = "1", path = "../signal" }
units = { package = "rvec-units", version = "1", path = "../units" }
