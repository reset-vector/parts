[package]
name = "rvec-ay8910"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
description = "The General Instrument AY-3-8910 programmable sound generator at its digital pins."
license = "MIT"
repository = "https://github.com/reset-vector/parts"
publish = false

[lib]
name = "ay8910"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
signal = { package = "rvec-signal", version = "1", path = "../signal" }
units = { package = "rvec-units", version = "1", path = "../units" }
