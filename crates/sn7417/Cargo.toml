[package]
name = "rvec-sn7417"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
description = "The Texas Instruments SN7417 hex buffer and driver with open-collector outputs, at its pins."
license = "MIT"
repository = "https://github.com/reset-vector/parts"
publish = false

[lib]
name = "sn7417"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
signal = { package = "rvec-signal", version = "1", path = "../signal" }
